name: probe
on:
  push:
    branches: [live-action]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/o && python3 tools/probe_polo.py /tmp/o/probe.json
          cd /tmp/o && git init -q && git config user.name p && git config user.email p@users.noreply.github.com && git add -A && git commit -q -m probe && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/probe-data
