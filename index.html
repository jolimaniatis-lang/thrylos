<!doctype html>
<html lang="el"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Θρύλος Daily</title>

<meta name="apple-mobile-web-app-title" content="Θρύλος">
<meta name="theme-color" content="#C8102E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:ital,wght@0,700;0,900;1,900&family=Manrope:wght@400;500;700;800&family=Noto+Serif+Display:wght@500;600;700&display=swap">
<style>
/* Layout: club-app — striped red hero with headline, floating next-match card + countdown, swipeable fixtures, sticky sport switcher, card feed, betting slip */
:root{
  --red:#C8102E; --red-2:#8E0A1F; --bg:#F2EFF0; --card:#FFFFFF; --ink:#17110F; --muted:#76696C; --line:#E6DEE0; --soft:#F7F2F3;
  --pill:#F1E6E8; --good:#14804A; --warn:#C27A00; --info:#2B5FD9; --shadow:0 1px 2px rgba(60,10,20,.06),0 8px 24px rgba(60,10,20,.07);
  --gold:#B8924F;--gold-t:#8A6A2F;--red-t:#C8102E;--serif:"Noto Serif Display","Playfair Display",Georgia,"Times New Roman",serif;
  --display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#E3263F; --red-2:#6E0716; --bg:#0F0B0C; --card:#1B1617; --ink:#F5EEEF; --muted:#A3969A; --line:#2C2426; --soft:#231C1E;
  --pill:#2B2124; --good:#3DCB82; --warn:#F0A93A; --info:#7EA2FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#E3263F; --red-2:#6E0716; --bg:#0F0B0C; --card:#1B1617; --ink:#F5EEEF; --muted:#A3969A; --line:#2C2426; --soft:#231C1E;
  --pill:#2B2124; --good:#3DCB82; --warn:#F0A93A; --info:#7EA2FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--red-2)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg{display:block}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 28px,transparent 28px 56px),
    radial-gradient(120% 90% at 100% 0%,#E8344B 0%,transparent 60%),
    linear-gradient(170deg,var(--red) 0%,var(--red-2) 100%)}
.hero .wrap{padding-block:calc(16px + env(safe-area-inset-top,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.word{font-family:var(--display);font-weight:900;font-style:italic;font-size:28px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.word span{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:11px;letter-spacing:2px;opacity:.8;margin-top:3px}
.date-btn{position:relative;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
.date-btn select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.date-btn:focus-within{outline:2px solid #fff;outline-offset:2px}
.headline{font-family:var(--body);font-weight:600;font-size:15px;line-height:1.35;margin:0;opacity:.92;text-wrap:balance}.headline[hidden]{display:none}
.updated{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#7CF0A8;box-shadow:0 0 0 3px rgba(124,240,168,.25)}


/* calm redesign */
#app section{margin-top:26px}
.brief{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px}
.brief h2{margin:0 0 10px;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);font-weight:800}
.brief ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.brief li{position:relative;padding-left:16px;font-size:15px;line-height:1.45}
.brief li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--red)}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.grp-h h2{margin:0;font-size:18px;font-weight:800}
.grp-h .cnt{font-size:12px;color:var(--muted);background:var(--pill);border-radius:999px;padding:1px 8px;font-weight:700}
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row>button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:flex-start;padding:13px 16px;cursor:pointer}
.row>button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px;line-height:1.35;font-weight:700}
.row .t small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.row .chev{flex:none;color:var(--muted);transition:transform .2s;margin-top:2px}
.row.open .chev{transform:rotate(90deg)}
.row .det{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.row .det p{margin:0;font-size:14.5px;line-height:1.55}
.row .det a{font-size:13px;font-weight:700;color:var(--red);text-decoration:none}
.row .det[hidden]{display:none}
.moreb{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;padding:12px;font-size:13.5px;font-weight:700;color:var(--red);cursor:pointer;border-top:1px solid var(--line)}


/* chat */
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
.chat-head b{font-size:15px}.chat-head button{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--red)}
.chat-list{display:flex;flex-direction:column;gap:10px;padding-bottom:150px;min-height:40vh}
.msg{max-width:86%;background:var(--card);border-radius:16px 16px 16px 4px;box-shadow:var(--shadow);padding:9px 12px;align-self:flex-start;display:flex;flex-direction:column;gap:5px}
.msg.me{align-self:flex-end;background:var(--red);color:#fff;border-radius:16px 16px 4px 16px}
.msg .mh{display:flex;gap:8px;align-items:baseline;font-size:12px;font-weight:800;opacity:.85}
.msg .mh span{font-weight:600;opacity:.7}.msg .mh button{all:unset;cursor:pointer;margin-left:auto;opacity:.5;font-size:12px}
.msg p{margin:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.msg img,.msg video{max-width:100%;max-height:360px;border-radius:12px;display:block;background:#000}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:14;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 12px}
.composer .in{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;font:16px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 14px;max-height:110px;min-height:40px}
.composer .ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--pill);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.composer .ib.send{background:var(--red);color:#fff}
.composer .st{max-width:680px;margin:0 auto 6px;font-size:12px;color:var(--muted)}
.gate{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0;font-size:20px}.gate p{margin:0;color:var(--muted);font-size:14px}
.gate input{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.gate button{font:800 15px var(--body);background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px;cursor:pointer}
.gate .err{color:var(--red);font-size:13px;font-weight:700}


.day{align-self:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--pill);border-radius:999px;padding:3px 12px;margin:8px 0 2px}
.mrow{display:flex;gap:8px;align-items:flex-end;max-width:92%;align-self:flex-start}
.mrow.me{align-self:flex-end;flex-direction:row-reverse}
.mrow.grp{margin-top:-6px}
.av{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.mrow .msg{max-width:none;min-width:0;align-self:auto}
.mrow.grp:not(.me) .msg{border-top-left-radius:6px}.mrow.grp.me .msg{border-top-right-radius:6px}
.msg .mh span{margin-left:auto;font-size:11px}.msg.me .mh span,.mrow.me .mh span{color:#fff}
.mrow.me .msg{background:linear-gradient(160deg,var(--red),var(--red-2));color:#fff}
.mrow:not(.me) .mh button{margin-left:4px}
.msg video,.msg img{width:min(260px,64vw);object-fit:cover}
.msg img{cursor:zoom-in}
.chat-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:60px 0;color:var(--muted)}.chat-empty .big{font-size:42px}.chat-empty b{color:var(--ink)}
.gal-l{display:flex;flex-direction:column;gap:8px;margin-top:14px}.gal-a{display:block;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);color:var(--red);font-weight:800;text-decoration:none}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}.lb img{max-width:100%;max-height:100%;border-radius:8px}


/* v3 polish */
.crest2{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:800 11px var(--body);letter-spacing:.3px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 1px 3px rgba(0,0,0,.2)}
#themeBtn{width:34px;height:34px;padding:0!important;justify-content:center;align-items:center;font-size:15px}#themeBtn svg{width:18px;height:18px}
.word{font-size:24px!important}.top{gap:8px}.top-r{display:flex;gap:6px;align-items:center}
.crest2.sm{width:24px;height:24px;font-size:9.5px}
.nm-teams{display:flex;align-items:center;gap:8px;margin:6px 0 2px}.nm-teams i{font-style:normal;color:var(--muted);font-weight:800}
.nm.nmlive{background:linear-gradient(160deg,var(--red),var(--red-2));color:#fff;cursor:pointer;grid-template-columns:1fr}
.nm.nmlive .nm-label{color:#fff;display:flex;align-items:center;gap:6px}
.nm.nmlive .nm-label::before{content:"";width:8px;height:8px;border-radius:50%;background:#7CF0A8;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.lv-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:6px}
.lv-row .tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:800;font-size:14px}
.lv-row .sc{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums}
.nm.nmlive .nm-meta{color:rgba(255,255,255,.8);text-align:center}
.gopp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gm:not(.open) .gnote{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.gm{cursor:pointer}
.bm-det{display:flex;flex-direction:column;gap:10px;animation:fadein .2s ease}
.bm-det[hidden]{display:none}
.bm-tg{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;text-align:center;font-weight:800;font-size:13.5px;color:var(--red);padding:10px;border-top:1px solid var(--line);margin-top:4px}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.row .det{animation:fadein .2s ease}
button:active,.tab:active,.gm:active{transform:scale(.97)}
.bar button{position:relative}
.bar .badge{position:absolute;top:3px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.ptr{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-60px);z-index:30;background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);transition:transform .15s}
.ptr.on{transform:translate(-50%,0)}

.tbl table{font-size:13px}.tbl td,.tbl th{padding-left:4px!important;padding-right:4px!important}.tbl td:nth-child(2){white-space:normal;text-align:left;line-height:1.2}
/* next match */
.next{margin-top:16px}
.nm{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.nm-label{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--red)}
.nm-match{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.1;margin:4px 0 2px;text-wrap:balance}
.nm-meta{font-size:13px;color:var(--muted)}
.cd{display:flex;gap:6px}
.cd div{background:var(--soft);border-radius:10px;min-width:48px;padding:6px 4px;text-align:center}
.cd b{display:block;font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.cd small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
@media (max-width:420px){.nm{grid-template-columns:1fr}.cd div{flex:1}}


/* Φάση 1: portal αρχικής */
.lead{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 18px 16px;border-left:5px solid var(--acc,var(--red));display:flex;flex-direction:column;gap:10px}
.lead-k{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--red)}
.lead-t{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.6vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.lead-b{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink)}
.lead-m{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.lead-m a{font-weight:700;color:var(--red);text-decoration:none}
.rs{flex:none;width:236px;scroll-snap-align:start;background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line);border-top:3px solid var(--acc,var(--red));display:flex;flex-direction:column;gap:8px}
.rs-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.rs-row{display:flex;flex-direction:column;gap:6px}
.rs-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-width:0}
.rs-t span:not(.crest2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-t b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.rs-t .crest2{width:24px;height:24px;font-size:10px}
.rs-m{font-size:12px;color:var(--muted)}
.rs[data-res=W] .rs-m{color:#12703d;font-weight:700}.rs[data-res=L] .rs-m{color:#B00D27;font-weight:700}:root[data-theme="dark"] .rs[data-res=W] .rs-m{color:#4FD18B}:root[data-theme="dark"] .rs[data-res=L] .rs-m{color:#FF6B7D}
:root[data-theme="dark"] .lead-k,:root[data-theme="dark"] .amx-s,:root[data-theme="dark"] .lead-m a{color:#FF6B7D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rs[data-res=W] .rs-m{color:#4FD18B}:root:not([data-theme="light"]) .rs[data-res=L] .rs-m{color:#FF6B7D}:root:not([data-theme="light"]) .lead-k,:root:not([data-theme="light"]) .amx-s,:root:not([data-theme="light"]) .lead-m a{color:#FF6B7D}}
.amx{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.amx-g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.amx-c h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.amx-r{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-size:13.5px;align-items:baseline;margin-top:8px}
.amx-d{color:var(--muted);font-size:12px;font-weight:700}.amx-n{font-weight:700;min-width:0}.amx-s{font-family:var(--display);font-weight:700;color:var(--red)}
.amx-cp{display:block;color:var(--muted);font-size:11.5px;margin-left:2px}.amx-e{font-size:13px;color:var(--muted);margin:0}
@media (max-width:560px){.amx-g{grid-template-columns:1fr}}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.qk-b{font:700 14px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;min-height:44px}
.qk-b:hover{border-color:var(--red)}
@media (min-width:900px){.rail.rs-rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;margin-inline:0;padding-inline:0}.rail.rs-rail .rs{width:auto}}


/* Φάση 2: Live Center */
.lc-bar{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px}
.lc-bar .dot{box-shadow:none;flex:none;width:11px;height:11px;border-radius:50%;background:var(--muted);display:inline-block}
.lc-bar .dot.on{background:#1FB157;animation:pulse 1.2s infinite}.lc-bar .dot.warn{background:var(--warn,#9A6410)}
.lc-bt b{display:block;font-size:15px}.lc-bt span{font-size:12.5px;color:var(--muted)}
.lc-filters{display:flex;flex-direction:column;gap:8px;margin-top:-10px}.lc-g .grp-h h2{flex:1;text-align:left}
.lc-empty{margin-top:14px;background:var(--card);border-radius:16px;padding:18px;border:1px dashed var(--line);text-align:center}
.lc-empty p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.lc-g{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.lc-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--acc,var(--red));cursor:pointer;min-height:44px}
.lc-row:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.lc-w{text-align:center}.lc-w b{display:block;font-family:var(--display);font-size:16px}.lc-w small{font-size:12px;color:var(--muted)}
.lc-m{min-width:0;display:flex;flex-direction:column;gap:5px}
.lc-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;min-width:0}
.lc-t span:not(.crest2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-t b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.lc-t .crest2{width:24px;height:24px;font-size:10px}
.lc-c{font-size:12px;color:var(--muted);line-height:1.3}
.lc-row .st-badge{margin-left:0}
@media (min-width:900px){.lc-g{gap:12px}}


/* Φάση 2: Match Center */
.sh-hero.mc-hero{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding-top:20px}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:40px;font-size:12.5px;font-weight:700;opacity:.95}
.mc-top .st-badge{margin-left:0;background:rgba(255,255,255,.22);color:#fff}.mc-top .st-badge.live{background:#fff;color:var(--red)}.mc-top .st-badge.live::before{background:var(--red)}

/* Φάση 3Α: ομάδες και Ερασιτέχνης */

.tm-l{display:flex;flex-direction:column;gap:2px}.tm-l small{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:800}

.tm-ch{display:flex;flex-wrap:wrap;gap:6px}.tm-chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--pill);color:var(--muted)}.tm-chip.on{background:color-mix(in srgb,#1a9a55 16%,transparent);color:#12703d}
:root[data-theme="dark"] .tm-chip.on{color:#4FD18B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tm-chip.on{color:#4FD18B}}
.tm-ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.tm-ac .qk-b{flex:1;min-width:110px;text-align:center}
.tm-hero{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0 4px;padding:16px;border-radius:18px;color:#fff;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 22px,transparent 22px 44px),linear-gradient(160deg,var(--red),var(--red-2))}
.tm-hero h2{margin:0;font-family:var(--display);font-size:26px;flex:1;min-width:0}.tm-hero p{margin:0;width:100%;font-size:13px;opacity:.92}
.tm-hero .ic{background:#fff}
.tm-sec{margin-top:22px;scroll-margin-top:70px}
.tm-list{display:flex;flex-direction:column;gap:10px}
.tm-next{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;cursor:pointer;border-left:4px solid var(--red)}
.tm-next small{font-size:11px;font-weight:800;letter-spacing:1.3px;color:var(--red)}.tm-next b{font-family:var(--display);font-size:22px;line-height:1.15}.tm-next span{font-size:13px;color:var(--muted)}
.tm-comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.tm-comp{background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}.tm-comp small{color:var(--muted);font-size:12px}
.tm-note{margin:8px 2px 0;font-size:13px;color:var(--muted);line-height:1.4}
.tm-ro{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.tm-ro small{color:var(--muted)}
.tm-un{margin-top:26px}
.tm-unr{margin-top:8px;display:flex;flex-direction:column;gap:2px}.tm-unr small{color:var(--muted)}
.lc-un,.un-tag{font-size:11.5px;font-weight:700;color:var(--warn,#9A6410)}.un-tag{margin-left:8px}
.un-note{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn,#9A6410) 12%,transparent);font-size:13px;color:var(--ink)}.un-note .moreb{display:inline;padding:0;margin-left:4px}
.tm-miss{font-size:12.5px;color:var(--muted)}.tm-rnote{line-height:1.4}
.gg{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}

/* sticky sport switcher */
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.switch .wrap{padding-block:12px}
.seg{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-block:3px;margin-block:-3px}
.seg::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;font:700 13.5px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .15s,color .15s}
.tab .n{font-size:11px;color:var(--muted);background:var(--pill);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.tab[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.tab[aria-pressed="true"] .n{background:rgba(255,255,255,.22);color:#fff}
.tab:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

main .wrap{padding-block:6px 48px;display:flex;flex-direction:column;gap:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.sec-h h2{font-family:var(--body);font-weight:800;font-size:18px;margin:0}
.sec-h span{font-size:12px;color:var(--muted);font-weight:600}

/* fixtures rail */
.rail{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.fx{flex:none;width:210px;scroll-snap-align:start;background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fx-top{display:flex;align-items:center;justify-content:space-between}
.fx-day{font-weight:800;font-size:13px}
.fx-time{font-family:var(--display);font-weight:700;font-size:20px;color:var(--red);font-variant-numeric:tabular-nums}
.fx-match{font-weight:800;font-size:14.5px;line-height:1.3;text-wrap:balance}
.fx-meta{font-size:12px;color:var(--muted);margin-top:auto}

/* sport icon */
.ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--pill);color:var(--red)}
.ic svg{width:17px;height:17px}
.ic{background:none;border-radius:50%}.ic.glyph{background:var(--pill);border-radius:9px}.ic img{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 1px var(--line)}

/* feed */
.feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-sport{font-size:12px;font-weight:700;color:var(--muted)}
.pill{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--pill);color:var(--muted)}
.pill.k-injury{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.k-transfer{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.k-odds{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.k-quote{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.pill.k-match{background:var(--ink);color:var(--card)}
.card h3{margin:0;font-size:17px;line-height:1.3;font-weight:800;text-wrap:balance}
.card p{margin:0;color:var(--ink);opacity:.86;font-size:14.5px}
.card p.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px}
.more{background:none;border:0;padding:0;font:700 12.5px var(--body);color:var(--red);cursor:pointer}
.src{color:var(--muted);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px;min-width:0}
.src:hover{color:var(--red)}

/* betting slip */
.slip{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.slip-h{background:var(--ink);color:var(--card);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.slip ol{list-style:none;margin:0;padding:6px 16px;counter-reset:t}

.slip li:first-child{border-top:0}
.slip li::before{content:counter(t);width:24px;height:24px;border-radius:50%;background:var(--pill);color:var(--red);font-weight:800;font-size:12px;display:grid;place-items:center}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px}

/* empty + skeleton */

@keyframes sh{to{background-position:-200% 0}}

.bar button[aria-current="page"]{color:var(--red);background:var(--pill)}

/* roster */
.r-sum{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}

.r-sum b{font-family:var(--display);font-size:21px;line-height:1.15}
.r-note{font-size:13px;color:var(--muted);margin:-14px 0 0}

.st.doubt{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st.away{background:var(--pill);color:var(--muted)}

.stats{display:flex;flex-wrap:wrap;gap:5px}
.stats span{font-size:12px;background:var(--soft);border-radius:7px;padding:2px 7px;font-variant-numeric:tabular-nums;color:var(--muted)}
.stats b{color:var(--ink);font-weight:800}
.coach{font-size:13.5px;color:var(--muted)}
.coach b{color:var(--ink)}
button.pl{width:100%;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer;grid-template-columns:44px 1fr 14px}
button.pl:hover{background:var(--soft)}
.pl-chev{color:var(--muted);font-size:22px;line-height:1;align-self:center}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,4,6,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .22s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}

.sh-hero{position:relative;color:#fff;padding:18px max(16px,env(safe-area-inset-left,0px)) 18px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 22px,transparent 22px 44px),linear-gradient(160deg,var(--red),var(--red-2));border-radius:22px 22px 0 0}

.score.W{background:var(--good)} .score.D{background:var(--muted)} .score.L{background:var(--red)}

.team b{font-size:14.5px;font-weight:800;line-height:1.2;text-wrap:balance}

// Greek capitals: drop the tonos on any text shown in uppercase (ΠΡΟΓΡΑΜΜΑ, not ΠΡΌΓΡΑΜΜΑ)
document.documentElement.lang="el";
function fixCaps(){document.querySelectorAll("body *").forEach(n=>{let tt;try{tt=getComputedStyle(n).textTransform}catch(_){return}
  if(tt!=="uppercase")return;n.childNodes.forEach(c=>{if(c.nodeType===3&&/[Ά-ώ]/.test(c.nodeValue)){const v=c.nodeValue.normalize("NFD").replace(/́/g,"").normalize("NFC");if(v!==c.nodeValue)c.nodeValue=v}})})}
let capsQ=false;new MutationObserver(()=>{if(capsQ)return;capsQ=true;requestAnimationFrame(()=>{capsQ=false;fixCaps()})}).observe(document.body,{childList:true,subtree:true,characterData:true});

(async()=>{
  const db=(()=>{
  const B="data/";let idx=null,idxTxt="";
  const j=async p=>{const r=await fetch(B+p+".json?t="+Date.now(),{cache:"no-store"});if(!r.ok){const e=new Error(p+" "+r.status);e.status=r.status;throw e}return r.text()};
  const subs=[];
  function poll(fn,ms){let last=null,busy=false;const run=async()=>{if(busy)return;busy=true;try{const t=await fn(last);if(t!==undefined)last=t}catch(e){}busy=false};run();subs.push(run);setInterval(()=>{if(document.visibilityState==="visible")run()},ms||45000);return run}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")subs.forEach(f=>f())});
  let ip=null,ipT=0;
  const getIdx=()=>{if(ip&&Date.now()-ipT<3000)return ip;ipT=Date.now();ip=j("index").then(t=>{const o=JSON.parse(t);if(!o||typeof o!=="object"||Array.isArray(o))throw new Error("bad index");idx=o;return t});ip.catch(()=>{ip=null});return ip};
  const docSnap=(id,o)=>({id,exists:o!=null,data:()=>o});
  return{
    collection(name){const q={lim:1000};const api={
      orderBy(){return api},limit(n){q.lim=n;return api},
      onSnapshot(cb,eb){poll(async last=>{
        const it=await getIdx();const ids=(it&&idx[name]||[]).slice(0,q.lim);
        const txts=await Promise.all(ids.map(i=>j(name+"/"+i)));const all=ids.join(",")+"|"+txts.join("");
        if(all===last)return;
        cb({docs:ids.map((id,k)=>docSnap(id,JSON.parse(txts[k])))});return all});}};return api},
    doc(path){return{onSnapshot(cb,eb){poll(async last=>{let t;try{t=await j(path)}catch(e){if(e.status!==404||last===null||last==="")return;t=""}
      if(t===last)return;cb(t===""?docSnap(path,null):docSnap(path,JSON.parse(t)));return t},path==="live/now"?15000:45000)}}}
  }})();

  db.collection("editions").orderBy("date","desc").limit(60).onSnapshot(snap=>{
    const keep=cur&&cur.date;loaded=true;
    editions=snap.docs.map(d=>d.data()).filter(Boolean);
    cur=editions.find(x=>x.date===keep)||editions[0]||null;
    fillSelect();render();
  },()=>{});
  db.doc("live/now").onSnapshot(s=>{live=s.exists===false?null:(s.data()||null);if(view==="live")render();else if(view==="news")renderNext()},()=>{});
  db.doc("schedule/opponents").onSnapshot(s=>{opps=s.exists===false?null:(s.data()||null);if(view==="vs")render()},()=>{});
  db.doc("schedule/season").onSnapshot(s=>{season=s.exists===false?null:(s.data()||null);if(season&&Array.isArray(season.matches))seasonKeep=season;if(view==="games"||view==="news"||view==="live"||(view==="more"&&!mmenu&&(mtab==="teams"||mtab==="amateur")))render()},()=>{});
  XD.forEach(k=>db.doc("schedule/"+k).onSnapshot(sn=>{X[k]=sn.exists===false?null:(sn.data()||null);if(view==="bet"&&k==="betting"||view==="more")render()},()=>{}));
  db.collection("rosters").onSnapshot(snap=>{rosters={};snap.docs.forEach(d=>{const x=d.data();if(x)rosters[d.id]=x});if(view==="roster")render();else if(view!=="live"&&view!=="chat")renderTabs()},()=>{});
})();

// Αριθμοί που «μετράνε» προς τα πάνω (σύνοψη ρόστερ, στατιστικά στα παράθυρα)· μόνο ακέραιοι, χωρίς reduced-motion
(function(){if(!("MutationObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const SEL=".r-sum b,.sheet .stats b,.sheet .facts b";
  const run=b=>{if(b.dataset.cu)return;const v=(b.textContent||"").trim();if(!/^\d{1,4}$/.test(v)||+v<2)return;b.dataset.cu="1";const N=+v,t0=performance.now(),D=700;
    const st=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);b.textContent=String(Math.round(N*e));if(k<1)requestAnimationFrame(st);else b.textContent=v};requestAnimationFrame(st)};
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches&&n.matches(SEL))run(n);n.querySelectorAll&&n.querySelectorAll(SEL).forEach(run)}))).observe(document.body,{childList:true,subtree:true})})();
